  const E=[S[0]+UA*d1[0],S[1]+UA*d1[1]],H=[E[0]+(FA+10)*d2[0],E[1]+(FA+10)*d2[1]],F=[H[0]+44*d2[0],H[1]+44*d2[1]];
  set(side+'u',{x1:S[0],y1:S[1],x2:E[0],y2:E[1]});set(side+'f',{x1:E[0],y1:E[1],x2:H[0]-8*d2[0],y2:H[1]-8*d2[1]});
  set(side+'h',{cx:H[0],cy:H[1]});set(side+'p',{x1:H[0],y1:H[1],x2:F[0],y2:F[1],opacity:pt>.5?1:0});
  const perp=side==='L'?[-d1[1],d1[0]]:[d1[1],-d1[0]];
  const M=[S[0]+UA*.5*d1[0]+perp[0]*(8+16*flex),S[1]+UA*.5*d1[1]+perp[1]*(8+16*flex)];
  const ang=Math.atan2(d1[1],d1[0])*180/Math.PI;
  set(side+'b',{cx:M[0],cy:M[1],rx:34+6*flex,ry:20+18*flex,transform:`rotate(${ang} ${M[0]} ${M[1]})`});
  set(side+'bG',{cx:M[0],cy:M[1],rx:34+6*flex,ry:20+18*flex,transform:`rotate(${ang} ${M[0]} ${M[1]})`,opacity:.75*flex});
  return {S,E,H,M,d2};
}
// captions
const CH=[];
SEG.forEach(([a,b,txt])=>{const w=txt.split(' ');const wt=w.map(x=>x.replace(/[^A-Za-z0-9']/g,'').length+2);const tot=wt.reduce((p,c)=>p+c,0);
  let acc=0;const times=w.map((x,i)=>{const s=a+(b-a)*acc/tot;acc+=wt[i];return s});
  const n=Math.ceil(w.length/4),per=Math.ceil(w.length/n);
  for(let i=0;i<w.length;i+=per){const ws=w.slice(i,i+per),ts=times.slice(i,i+per);CH.push({s:ts[0],words:ws,ts,end:i+per>=w.length?b:times[i+per]})}});
let lastCh=-1;
function caption(t){let k=-1;for(let i=0;i<CH.length;i++)if(CH[i].s<=t)k=i;const cap=$('cap');
  if(k<0||t>CH[k].end+0.6){cap.style.opacity=0;return}
  const c=CH[k];if(k!==lastCh){cap.innerHTML=c.words.map(w=>`<span>${w.replace(/\.\.\.$/,'…').toUpperCase()}</span>`).join('');lastCh=k}
  const sp=cap.children;let a=0;for(let i=0;i<c.ts.length;i++)if(c.ts[i]<=t)a=i;
  for(let i=0;i<sp.length;i++){sp[i].className=i===a?'on':'';sp[i].style.transform='none'}
  const p=clamp((t-c.s)/.12);cap.style.opacity=1;cap.style.transform=`translate(-50%,-50%) scale(${.92+.08*eo(p)})`}
let EL=null;
function render(t){
  EL=EL||[...document.querySelectorAll('[data-in]')];
  for(const el of EL){const tin=+el.dataset.in,tout=+el.dataset.out,fx=el.dataset.fx||'up';
    let o=0,dy=0,s=1,r=+(el.dataset.rot||0);
    if(t>=tin){const d=fx==='slam'?.24:fx==='pop'?.5:.42,p=clamp((t-tin)/d);
      if(fx==='up'){o=eo(p);dy=(1-eo(p))*70}else if(fx==='pop'){o=clamp(p*3);s=.3+.7*eob(p)}
      else if(fx==='slam'){o=clamp(p*4);s=2.6-1.6*eo(p)}else o=eo(p);
      const q=clamp((t-tout)/.22);if(q>0){o*=1-q;s*=1-.08*q;dy-=q*30}}
    el.style.opacity=o;el.style.visibility=o<.002?'hidden':'visible';
    el.style.transform=`translate(-50%,-50%) translateY(${dy}px) scale(${s}) rotate(${r}deg)`}
  $('prog').style.width=(t/DUR*1080)+'px';
  // ---- camera: whips + punch-ins + slow push
  let wx=0,blur=0,sc=1+.02*Math.sin(t*.6),shx=0,shy=0,fl=0;
  for(const W of WH){const po=clamp((t-(W-.16))/.16);if(t>=W-.16&&t<W){wx=-eio(po)*520;blur=po*16}
    const pi=clamp((t-W)/.34);if(t>=W&&pi<1){wx=(1-eo(pi))*900;blur=(1-pi)*16}}
  for(const M of MY){const d=t-M.f;if(d>=0&&d<.9){sc+=.09*Math.exp(-d*5);const k=Math.exp(-d*9);shx+=Math.sin(d*95)*20*k;shy+=Math.cos(d*80)*14*k;fl=Math.max(fl,.35*Math.exp(-d*10))}}
  if(t<.5){const d=t;sc+=.06*Math.exp(-d*6)}
  $('world').style.transform=`translate(${wx+shx}px,${shy}px) scale(${sc})`;$('world').style.filter=blur>.3?`blur(${blur}px)`:'none';
  $('grid').style.transform=`translate(${(wx*.3)%90}px,${(t*12)%90}px)`;$('flash').style.opacity=fl;
  // ---- myth widgets
  MY.forEach((M,i)=>{const p=clamp((t-M.g)/(M.f-M.g));set('rg'+i,{'stroke-dashoffset':402*p});
    {const q=(t-M.g)/(M.f-M.g);$('rn'+i).textContent=q<.34?'3':q<.67?'2':'1';}
    const rv=t>=M.f;const bf=$('bf'+i),bt=$('bt'+i);
    bf.style.background=rv?'#C6F24E':'';bf.style.color=rv?'#0A0C10':'';bf.style.borderColor=rv?'#C6F24E':'';bf.style.boxShadow=rv?'0 0 40px rgba(198,242,78,.7)':'';
    bt.style.opacity=rv?.3:1;
    $('x'+i).style.transform=`scaleX(${eo(clamp((t-M.f-.05)/.25))}) rotate(-3deg)`});
  ['c1','c2'].forEach((c,i)=>{const on=Math.floor((t-22.435)*1.6)%2===i&&t>23.035;const e=$(c);e.style.background=on?'#C6F24E':'';e.style.color=on?'#0A0C10':'';e.style.borderColor=on?'#C6F24E':''});

  // ---- character
  const P=pose(t);
  let liftL=0,liftR=0,bob=0,rot=0;
  const press=win(t,[[0,4.382000000000001],[7.99,12.898000000000001]],.2);
  if(press>0){const sp=t<4.482?4.2:6.5;const c=.5-.5*Math.cos(t*sp);['L','R'].forEach(s=>{P[s+'UA']+=(60+98*c-P[s+'UA'])*press;P[s+'FA']+=(115-103*c-P[s+'FA'])*press});bob=c*6*press}
  const shrug=win(t,[[14.031,15.818]],.25);if(shrug>0){bob+=Math.abs(Math.sin(t*5))*10*shrug}
  const look=win(t,[[5.35,7.246]],.25);rot+=Math.sin(t*3)*2*look;
  if(t>22.834999999999997){P.LFA+=Math.sin(t*9)*6}

  const hy=P.hy+Math.sin(t*2.3)*3-bob-34*P.tread;
  set('char',{transform:`translate(${P.cx},${hy}) scale(${P.s}) rotate(${rot} 0 380)`});
  set('tread',{opacity:P.tread,transform:`translate(0,${34*P.tread})`});
  set('soreG',{opacity:P.sore*(.6+.4*Math.sin(t*8))});
  [['L',-48,liftL],['R',48,liftR]].forEach(([sd,x,lift])=>{const fx=x*1.12,fy=340-lift;set(sd+'th',{x1:x,y1:60,x2:fx,y2:fy});
    const dir=sd==='L'?-1:1;set(sd+'shoe',{d:`M${fx-30*(dir<0?1.4:1)},${fy+5} Q${fx},${fy-22} ${fx+30*(dir>0?1.4:1)},${fy+5} L${fx+36*(dir>0?1.5:1)},${fy+32} Q${fx},${fy+44} ${fx-36*(dir<0?1.5:1)},${fy+32} Z`})});
  const fem=P.fem==='f',ww=fem?88:112;
  $('torso').setAttribute('d',`M-88,-302 Q0,-266 88,-302 L114,-292 C128,-250 106,-215 104,-190 C104,-150 ${ww},-128 ${ww},-82 C${ww},-36 98,-22 98,2 L-98,2 C-98,-22 -${ww},-36 -${ww},-82 C-${ww},-128 -104,-150 -104,-190 C-106,-215 -128,-250 -114,-292 Z`);
  if(P.fem!==lastFem){lastFem=P.fem;$('torso').setAttribute('fill',fem?'url(#shirtF)':'url(#shirt)');set("belly",{rx:80,ry:60,opacity:fem?0:.35});
    set('hairM',{opacity:fem?0:1});set('hairF',{opacity:fem?1:0});set('lash',{opacity:fem?1:0});set('hairBack',{opacity:fem?1:0});set('chestMark',{fill:fem?'#C6F24E':'#0A0C10'})}
  set('pony',{transform:`rotate(${Math.sin(t*6)*6} 70 -460)`});
  const A=arm('L',P,P.flexL,P.ptL),B=arm('R',P,P.flexR,P.ptR);
  set('shaker',{opacity:P.shaker,transform:`translate(${B.H[0]},${B.H[1]})`});
  // barbell between hands
  const dx=B.H[0]-A.H[0],dy=B.H[1]-A.H[1],dl=Math.hypot(dx,dy)||1,ux=dx/dl,uy=dy/dl,ext=70;
  const p1=[A.H[0]-ux*ext,A.H[1]-uy*ext],p2=[B.H[0]+ux*ext,B.H[1]+uy*ext],an=Math.atan2(uy,ux)*180/Math.PI;
  set('bbar',{x1:p1[0]-ux*30,y1:p1[1]-uy*30,x2:p2[0]+ux*30,y2:p2[1]+uy*30});
  set('pL',{transform:`translate(${p1[0]},${p1[1]}) rotate(${an})`});set('pR',{transform:`translate(${p2[0]},${p2[1]}) rotate(${an})`});
  set('barbell',{opacity:P.bb});
  $('head').setAttribute('transform',`rotate(${P.tilt} 0 -320)`);
  const blink=((t+.4)%3.4)<.12?.12:1;set('eL',{ry:11*blink});set('eR',{ry:11*blink});
  const by=-428-P.brow*9,ang=-P.brow*6;
  set('bL',{x1:-38,y1:by+ang*.6,x2:-12,y2:by-ang*.6+(P.brow<0?6*-P.brow:0)});set('bR',{x1:38,y1:by+ang*.6,x2:12,y2:by-ang*.6+(P.brow<0?6*-P.brow:0)});
  if(P.mouth!==lastMouth){$('mouth').innerHTML=MOUTH[P.mouth];lastMouth=P.mouth}
  const swo=win(t,SWO);
  SW.forEach((d,i)=>{const u=((t*1.1+i/5)%1),x=(i%2?-1:1)*(62+i*6);set(d,{transform:`translate(${x},${-450+u*80}) scale(${1.15-i*.08})`,opacity:swo*Math.sin(u*Math.PI)})});
  caption(t);
}
window.render=render;render(0);
