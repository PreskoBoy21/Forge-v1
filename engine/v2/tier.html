<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(anton-latin-400-normal.woff2)}@font-face{font-family:I;src:url(inter-tight-latin-800-normal.woff2);font-weight:800}@font-face{font-family:I;src:url(inter-tight-latin-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;background:radial-gradient(90% 60% at 50% 55%,#1c120b,#080808 60%,#050505);overflow:hidden;font-family:I;color:#fff;position:relative}
#tag{position:absolute;left:70px;top:120px;font-weight:800;font-size:30px;letter-spacing:.25em;color:#8E8E8E}
#wm{position:absolute;right:70px;top:120px;font-family:A;font-size:40px;letter-spacing:.06em}#wm span{color:#FF6A1A}
#title{position:absolute;left:70px;right:70px;top:180px;font-family:A;font-size:110px;line-height:1;text-transform:uppercase}#title .o{color:#FF6A1A}
#board{position:absolute;left:50px;right:50px;top:440px}
.row{display:flex;align-items:stretch;height:168px;margin-bottom:14px;border-radius:22px;overflow:hidden;background:#141414;border:2px solid #222}
.lab{width:150px;flex:none;display:flex;align-items:center;justify-content:center;font-family:A;font-size:96px;color:#000}
.items{flex:1;display:flex;flex-wrap:wrap;align-content:center;gap:12px;padding:0 18px}
.chip{font-weight:800;font-size:34px;padding:14px 22px;border-radius:16px;background:#232323;border:2px solid #333;white-space:nowrap;transform-origin:center}
.chip.new{border-color:#FF6A1A;background:#2a1408}
#reason{position:absolute;left:70px;right:70px;top:1380px;min-height:220px}
#reason .n{font-family:A;font-size:76px;text-transform:uppercase;line-height:1.05}
#reason .why{margin-top:14px;font-weight:600;font-size:44px;line-height:1.3;color:#d0d0d0}
#cta{position:absolute;left:70px;right:70px;top:1420px;font-family:A;font-size:92px;line-height:1.04;text-transform:uppercase;opacity:0}#cta .o{color:#FF6A1A}
#prog{position:absolute;left:0;top:0;height:8px;background:#FF6A1A}
</style></head><body>
<div id="prog"></div><div id="tag">TIER LIST</div><div id="wm">FORGE<span>.</span></div>
<div id="title"></div><div id="board"></div><div id="reason"><div class="n"></div><div class="why"></div></div>
<div id="cta"></div>
<script>
const CFG=window.CFG||{
 title:'Ranking every <span class="o">chest</span> exercise',
 tiers:[['S','#FF6A1A'],['A','#FF8A45'],['B','#FFB27A'],['C','#BDBDBD'],['D','#6F6F6F']],
 items:[
  ['B','Push-ups','Great to start, but hard to keep adding load.'],
  ['S','Incline DB press','Deep stretch, hits upper and mid chest.'],
  ['C','Decline bench','Mostly lower chest, shorter range.'],
  ['A','Weighted dips','Huge stretch — lean forward to hit chest.'],
  ['S','Barbell bench','Easiest lift to load heavy and progress.'],
  ['B','Cable fly','Stretch under tension, light loads only.'],
  ['D','Floor press','The floor cuts off the stretch.'],
  ['A','Machine press','Stable, so you can push close to failure.'],
 ],
 cta:'Agree? <span class="o">Comment</span> what you’d move 👇',
 at:[2.16,6.12,10.79,14.93,18.93,22.64,26.48,29.97], ctaAt:34.04, end:36.4,
};
const $=id=>document.getElementById(id), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), eo=t=>1-Math.pow(1-t,3);
$('title').innerHTML=CFG.title;
$('board').innerHTML=CFG.tiers.map(([t,c])=>`<div class="row"><div class="lab" style="background:${c}">${t}</div><div class="items" id="r${t}"></div></div>`).join('');
const END=CFG.end;
window.DUR=END;
window.render=function(t){
  CFG.tiers.forEach(([k])=>$('r'+k).innerHTML='');
  let cur=-1;
  CFG.items.forEach((it,i)=>{const ti=CFG.at[i];if(t<ti)return;cur=i;
    const a=cl((t-ti)/.35),e=eo(a);const isNew=i===CFG.at.filter(x=>x<=t).length-1&&t<CFG.ctaAt;
    const d=document.createElement('div');d.className='chip'+(isNew?' new':'');d.textContent=it[1];
    d.style.opacity=e;d.style.transform=`translateY(${(1-e)*-120}px) scale(${1+.25*(1-e)})`;$('r'+it[0]).appendChild(d);});
  const R=$('reason'),inCta=t>=CFG.ctaAt;
  if(cur>=0&&!inCta){const it=CFG.items[cur],ti=CFG.at[cur],a=cl((t-ti-.15)/.3);
    const col=CFG.tiers.find(x=>x[0]===it[0])[1];
    R.querySelector('.n').innerHTML=`<span style="color:${col}">${it[0]} tier</span> · ${it[1]}`;R.querySelector('.why').textContent=it[2];R.style.opacity=a;}
  else R.style.opacity=0;
  $('cta').innerHTML=CFG.cta;$('cta').style.opacity=inCta?cl((t-CFG.ctaAt)/.4):0;
  const CAM=Math.floor(t/2.5)%2, cu=cl((t%2.5)/.35), z=CAM?1+.025*cu:1.025-.025*cu;$('board').style.transform=`scale(${z.toFixed(4)})`;$('board').style.transformOrigin='50% 40%';
  $('prog').style.width=(cl(t/END)*1080)+'px';
};
</script></body></html>
