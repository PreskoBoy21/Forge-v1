<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(anton-latin-400-normal.woff2)}@font-face{font-family:I;src:url(inter-tight-latin-800-normal.woff2);font-weight:800}@font-face{font-family:I;src:url(inter-tight-latin-600-normal.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;background:#050505;overflow:hidden;font-family:I;color:#fff;position:relative}
#hook{position:absolute;left:64px;right:64px;top:210px;font-family:A;font-size:112px;line-height:1.0;text-transform:uppercase;text-align:center}
#hook .o{color:#FF6A1A}
.lab{position:absolute;top:600px;width:540px;text-align:center;font-family:A;font-size:76px;text-transform:uppercase}
#labL{left:0;color:#FF4A4A}#labR{left:540px;color:#2BD46B}
#div{position:absolute;left:538px;top:600px;width:4px;height:850px;background:linear-gradient(#FF6A1A00,#FF6A1A,#FF6A1A00)}
#cap{position:absolute;left:64px;right:64px;top:1530px;text-align:center;font-family:A;font-size:84px;line-height:1.05;text-transform:uppercase}
#cap .r{color:#FF4A4A}#cap .g{color:#2BD46B}#cap .o{color:#FF6A1A}
.call{position:absolute;font-weight:800;font-size:28px;padding:8px 16px;border-radius:999px;white-space:nowrap;opacity:0;z-index:5}
#prog{position:absolute;left:0;top:0;height:8px;background:#FF6A1A;z-index:25}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
<defs>
 <radialGradient id="bgL" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#2a0c0c"/><stop offset="1" stop-color="#050505"/></radialGradient>
 <radialGradient id="bgR" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#0b2414"/><stop offset="1" stop-color="#050505"/></radialGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAFAFA"/><stop offset=".6" stop-color="#D9D9D9"/><stop offset="1" stop-color="#B0B0B0"/></linearGradient>
 <linearGradient id="skinFar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c6c6c"/><stop offset="1" stop-color="#3e3e3e"/></linearGradient>
 <linearGradient id="shorts" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b2b"/><stop offset="1" stop-color="#151515"/></linearGradient>
 <linearGradient id="musc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset=".5" stop-color="#FF6A1A"/><stop offset="1" stop-color="#B8420A"/></linearGradient>
 <filter id="mglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <radialGradient id="plate"><stop offset=".18" stop-color="#a8a8a8"/><stop offset=".22" stop-color="#2c2c2c"/><stop offset=".84" stop-color="#1b1b1b"/><stop offset=".88" stop-color="#FF6A1A"/><stop offset="1" stop-color="#B8420A"/></radialGradient>
</defs>
<rect id="pL" x="0" y="560" width="540" height="920" fill="url(#bgL)"/><rect id="pR" x="540" y="560" width="540" height="920" fill="url(#bgR)"/>
<g id="gL"></g><g id="gR"></g>
</svg>
<div id="prog"></div><div id="hook"></div>
<div class="lab" id="labL">✕ Wrong</div><div class="lab" id="labR">✓ Right</div><div id="div"></div>
<div id="cap"></div>
<div id="cL1" class="call"></div><div id="cL2" class="call"></div><div id="cR1" class="call"></div><div id="cR2" class="call"></div>
<script src="rig2.js"></script>
<script src="ex2.js"></script>
<script>
const CFG=window.CFG||{};
const $=id=>document.getElementById(id), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
$('hook').innerHTML=CFG.hook;
const phase=t=>{const c=t%3.2;return c<1.3?ease(c/1.3):c<1.6?1:c<2.6?1-ease((c-1.6)/1):0};
function drawSide(g,bad,k,ox,focus,t){
  g.innerHTML='';const s=1.62,cx=ox+270,ty=1420;
  const CAM=Math.floor(t/2.5)%2,cu=cl((t%2.5)/.35),z=(CAM?1+.05*cu:1.05-.05*cu)*(1+.04*focus);
  const es=s*z, ex=cx-292*es, ey=ty-528*es;g.setAttribute('transform',`translate(${ex},${ey}) scale(${es})`);
  const F=new Fig(g);F.el('ellipse',{cx:300,cy:528,rx:170,ry:10,fill:bad?'#FF3B3B':'#2BD46B',opacity:.14});
  const r=squat(F,k,bad);
  F.el('line',{x1:r.mid,y1:200,x2:r.mid,y2:526,stroke:bad?'#FF3B3B':'#2BD46B','stroke-dasharray':'6 8','stroke-width':2.4,opacity:.7});
  return {r,ex,ey,es};
}
window.render=function(t){
  const k=t<CFG.moveAt?0:phase(t-CFG.moveAt);
  // which side is being talked about
  const cur=[...CFG.lines].reverse().find(l=>t>=l.at)||{side:'both'};
  const fL=cur.side==='L'?1:0, fR=cur.side==='R'?1:0;
  const L=drawSide($('gL'),true,k,0,fL,t), R=drawSide($('gR'),false,k,540,fR,t);
  $('gL').style.opacity=cur.side==='R'?.35:1;$('gR').style.opacity=cur.side==='L'?.35:1;
  $('labL').style.opacity=cur.side==='R'?.35:1;$('labR').style.opacity=cur.side==='L'?.35:1;
  // hook: big at top, shrinks after first line
  const h=$('hook');h.style.transform=`scale(${1+.05*(1-cl(t/.3))})`;
  // caption
  const cap=$('cap');if(cur.text){const a=cl((t-cur.at)/.2);cap.innerHTML=cur.text;cap.style.opacity=a;cap.style.transform=`translateY(${(1-a)*20}px) scale(${1+.06*(1-a)})`;}else cap.style.opacity=0;
  // callouts (shown when deep in the rep and that side is in focus or both)
  const deep=cl((k-.55)/.3);
  const put=(id,P,txt,col,side,dx)=>{const el=$(id);el.textContent=txt;const X=P.ex+P.v[0]*P.es,Y=P.ey+P.v[1]*P.es;el.style.left=(X+dx(el))+'px';el.style.top=(Y-22)+'px';el.style.background=col;el.style.color=col==='#2BD46B'?'#000':'#fff';el.style.opacity=deep*(cur.side===side||cur.side==='both'?1:0)*(t>=CFG.calloutsAt?1:0);};
  put('cL1',{...L,v:L.r.knee},'KNEES',  '#FF3B3B','L',el=>20);
  put('cL2',{...L,v:L.r.heel},'HEELS UP','#FF3B3B','L',el=>-el.offsetWidth+30);
  put('cR1',{...R,v:R.r.hip},'GLUTES',  '#2BD46B','R',el=>-el.offsetWidth-10);
  put('cR2',{...R,v:R.r.knee},'QUADS',  '#2BD46B','R',el=>20);
  $('prog').style.width=(cl(t/CFG.endAt)*1080)+'px';
  BRAND.end(t,CFG.endAt);
};
</script>
<script src="brand.js"></script>
</body></html>
