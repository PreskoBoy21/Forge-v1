<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge – Email confirmed</title><link rel="stylesheet" href="_style.css"></head>
<body><main>
<h1 id="t">Email confirmed ✅</h1>
<p id="m">Your Forge account is ready. Go back to the Forge app and log in with your email and password.</p>
<p><a href="forge://sign-in?mode=signin">Open Forge</a></p>
<p class="muted">Forge: AI Gym Coach · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
</main>
<script>
  // Supabase puts errors in the URL hash, e.g. #error=access_denied&error_code=otp_expired
  var h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (h.get('error')) {
    document.getElementById('t').textContent = 'This link has expired';
    document.getElementById('m').textContent =
      'Confirmation links work once and expire after a while. Open Forge and sign up again with the same email to get a new link. If your email is already confirmed, just log in.';
  }
</script>
</body></html>
