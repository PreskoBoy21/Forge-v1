name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  phone-smoke:
    name: Phone-size browser smoke test
    runs-on: ubuntu-latest
    needs: checks
    env:
      EXPO_OFFLINE: '1'
      CI: '1'
      BROWSER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Start Expo web dev server
        run: |
          npx expo start --web --port 8099 > expo-web.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8099/welcome > /dev/null && break; sleep 2; done
      - name: Open every main screen at iPhone 15 size
        run: node e2e/smoke.cjs http://127.0.0.1:8099 e2e-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: |
            e2e-shots
            expo-web.log
