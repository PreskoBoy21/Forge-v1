name: Deploy site + web app

# Landing page (docs/) at /Forge-v1/ and the Forge web app at /Forge-v1/app/.
# Needs Settings → Pages → Source: "GitHub Actions" (one-time).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_OFFLINE: '1'
      EXPO_PUBLIC_BASE_URL: /Forge-v1/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app
        run: npx expo export -p web --output-dir _site/app
      - name: Add the landing page
        run: |
          cp -r docs/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
